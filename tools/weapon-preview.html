<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>Weapon Preview</title>
<style>
  body{margin:0;background:#1a1d22;overflow:hidden}
  #info{position:fixed;left:12px;top:12px;color:#cfd3d8;font:12px/1.6 monospace;
        text-shadow:0 1px 3px #000;white-space:pre;z-index:10}
  canvas{display:block}
</style></head>
<body>
<div id="info">loading…</div>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setClearColor(0x1a1d22);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2.0));
const d1 = new THREE.DirectionalLight(0xffffff, 2.0); d1.position.set(3, 5, 4); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x88aaff, 1.2); d2.position.set(-4, 2, -3); scene.add(d2);

// 坐标轴：红=X 绿=Y 蓝=Z
scene.add(new THREE.AxesHelper(0.8));
// 地面网格
const grid = new THREE.GridHelper(2, 20, 0x444a55, 0x2a3038);
grid.position.y = -0.6;
scene.add(grid);

const params = new URLSearchParams(location.search);
const url = params.get('m') ?? '/assets/jian_min.glb';

const draco = new DRACOLoader().setDecoderPath('/node_modules/three/examples/jsm/libs/draco/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const gltf = await loader.loadAsync(url);
const model = gltf.scene;
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
scene.add(new THREE.Box3Helper(box, 0xffaa00));

// 沿三个轴各画一条穿过中心的线，看长轴对不对
const mkLine = (a, b, color) => {
  const g = new THREE.BufferGeometry().setFromPoints([a, b]);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color }));
};
const R = Math.max(size.x, size.y, size.z) * 0.7;
scene.add(mkLine(new THREE.Vector3(center.x - R, center.y, center.z), new THREE.Vector3(center.x + R, center.y, center.z), 0xff3333));
scene.add(mkLine(new THREE.Vector3(center.x, center.y - R, center.z), new THREE.Vector3(center.x, center.y + R, center.z), 0x33ff33));
scene.add(mkLine(new THREE.Vector3(center.x, center.y, center.z - R), new THREE.Vector3(center.x, center.y, center.z + R), 0x3388ff));

// 沿最长轴分段量横截面半径，找出「粗的一端」（剑柄通常更粗）
let tris = 0;
model.traverse(o => { if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });

const axis = size.x >= size.y && size.x >= size.z ? 'x' : (size.y >= size.z ? 'y' : 'z');
const axisIdx = { x: 0, y: 1, z: 2 }[axis];
const N = 10;
const bins = Array.from({ length: N }, () => ({ maxR: 0, count: 0 }));
const v = new THREE.Vector3();
model.updateMatrixWorld(true);
model.traverse(o => {
  if (!o.isMesh) return;
  const pa = o.geometry.attributes.position;
  for (let i = 0; i < pa.count; i += Math.max(1, Math.floor(pa.count / 3000))) {
    v.fromBufferAttribute(pa, i); o.localToWorld(v);
    const rel = (v.getComponent(axisIdx) - box.min.getComponent(axisIdx)) / size.getComponent(axisIdx);
    const b = Math.min(N - 1, Math.max(0, Math.floor(rel * N)));
    const other = [0, 1, 2].filter(k => k !== axisIdx);
    const rr = Math.hypot(v.getComponent(other[0]) - center.getComponent(other[0]),
                          v.getComponent(other[1]) - center.getComponent(other[1]));
    bins[b].maxR = Math.max(bins[b].maxR, rr);
    bins[b].count++;
  }
});

let report = `模型: ${url}\n三角面: ${Math.round(tris)}\n`;
report += `包围盒 size: ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)} m\n`;
report += `长轴: ${axis.toUpperCase()} (${size[axis].toFixed(3)}m)\n\n`;
report += `沿 ${axis.toUpperCase()} 轴分段的最大半径（粗=剑柄/护手，细=剑尖）:\n`;
bins.forEach((b, i) => {
  const bar = '█'.repeat(Math.round(b.maxR / Math.max(...bins.map(x => x.maxR)) * 24));
  report += `  ${(i / N).toFixed(1)}–${((i + 1) / N).toFixed(1)}  r=${b.maxR.toFixed(3)}  ${bar}\n`;
});
document.getElementById('info').textContent = report;
window.__REPORT__ = report;
window.__AXIS__ = axis;
window.__SIZE__ = [size.x, size.y, size.z];

// 相机：沿最短轴看过去，能看清剑的完整轮廓
camera.position.set(center.x + size.x * 2.2 + 0.6, center.y + size.y * 1.5 + 0.3, center.z + size.z * 2.2);
camera.lookAt(center);
renderer.render(scene, camera);
window.__DONE__ = true;
</script></body></html>
